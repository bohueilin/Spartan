# Daemon JVM criteria. Studio generated a jetbrains/21 pin here, but the JetBrains Runtime cannot
# be provisioned by the foojay resolver (no public download), which broke every CLI/CI build.
# Plain JDK 17 matches the project's toolchain (compile/target 17), the Homebrew JDK on the dev
# machine, and Temurin 17 on CI. Studio still runs fine with this criteria.
toolchainVersion=17
